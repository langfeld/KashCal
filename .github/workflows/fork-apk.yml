name: Fork APK (Debug)

# Fork-only build: this file lives ONLY on the `apk` branch of langfeld/KashCal, never on
# `main` — so it can never leak into a pull request against the upstream KashCal/KashCal
# repo. Merging `main` (or any feature branch) into `apk` and pushing triggers a fresh
# debug APK, downloadable from the run's Artifacts section.
on:
  push:
    branches: [apk]

permissions: read-all

jobs:
  build-debug-apk:
    # Belt and braces: even if this file ever lands on another repo/branch, the job
    # refuses to run anywhere but the fork.
    if: github.repository == 'langfeld/KashCal'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Get version from properties
      id: version
      run: |
        VERSION_NAME=$(grep VERSION_NAME version.properties | cut -d'=' -f2)
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk \
           app/build/outputs/apk/debug/KashCal-${{ steps.version.outputs.version }}-debug.apk

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: KashCal-${{ steps.version.outputs.version }}-debug
        path: app/build/outputs/apk/debug/KashCal-${{ steps.version.outputs.version }}-debug.apk
